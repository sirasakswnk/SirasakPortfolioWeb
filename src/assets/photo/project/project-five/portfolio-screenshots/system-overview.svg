<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
<title id="title">MonoShop system overview</title>
<desc id="desc">Customers and administrators use the Vue frontend and Pinia state stores. Axios calls the Express API, which queries PostgreSQL and serves images from the backend filesystem. Authentication uses bcrypt password hashes and JWT in an HttpOnly cookie.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7654b7"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#25213c" flood-opacity="0.055"/></filter>
  <style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#28243b}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#786392}.heading{font-size:32px;font-weight:700}.body{font-size:18px;fill:#625b75}.small{font-size:16px;fill:#746b83}.cardTitle{font-size:21px;font-weight:700}.link{fill:none;stroke:#7654b7;stroke-width:3;marker-end:url(#arrow)}.twoWay{marker-start:url(#arrow)}.label{font-size:16px;fill:#715593;text-anchor:middle}</style>
</defs>
<rect width="1920" height="1280" fill="#f7f6fc"/>
<rect x="60" y="58" width="8" height="96" rx="4" fill="#7953bd"/>
<text x="90" y="78" class="eyebrow">ART TOY COMMERCE · OBSERVED IMPLEMENTATION</text>
<text x="88" y="130" font-size="48" font-weight="700">MonoShop system overview</text>
<text x="90" y="165" font-size="21" fill="#746b83">Vue 3 + Pinia + Bootstrap · Express · PostgreSQL</text>
<g id="people">
<rect x="60" y="210" width="254" height="600" rx="24" fill="#fff" stroke="#e5dfed" filter="url(#shadow)"/>
<text x="84" y="246" class="eyebrow" >01 PEOPLE</text>
<text x="84" y="286" class="heading" >People</text>
<text x="84" y="312" class="body" >Browser clients</text>
<rect x="82" y="338" width="210" height="172" rx="16" fill="#f7f1ff" stroke="#e8dcf6"/>
<text x="100" y="372" class="cardTitle" >Customer</text>
<text x="100" y="405" class="body" >Browse &amp; search</text>
<text x="100" y="432" class="body" >Add to cart</text>
<text x="100" y="459" class="body" >Place/view orders</text>
<text x="100" y="486" class="body" >Account/profile</text>
<rect x="82" y="538" width="210" height="188" rx="16" fill="#f0f5ff" stroke="#dde6f5"/>
<text x="100" y="573" class="cardTitle" >Administrator</text>
<text x="100" y="607" class="body" >Edit products</text>
<text x="100" y="634" class="body" >Review orders</text>
<text x="100" y="661" class="body" >Confirm / delete</text>
<text x="100" y="688" class="body" >order records</text>
</g>
<g id="frontend">
<rect x="380" y="210" width="420" height="600" rx="24" fill="#fff" stroke="#e5dfed" filter="url(#shadow)"/>
<text x="404" y="246" class="eyebrow" >02 FRONTEND</text>
<text x="404" y="286" class="heading" >Vue 3 frontend</text>
<text x="404" y="312" class="body" >Vue Router · Bootstrap · Axios</text>
<rect x="404" y="338" width="372" height="148" rx="16" fill="#f8f5ff" stroke="#e8def5"/>
<text x="426" y="371" class="cardTitle" >Application views</text>
<text x="426" y="403" class="body" >Home · catalog · product details</text>
<text x="426" y="431" class="body" >Member · cart · orders</text>
<text x="426" y="459" class="body" >Admin orders · product edit</text>
<rect x="404" y="548" width="372" height="166" rx="16" fill="#edf7f3" stroke="#d5e8df"/>
<text x="426" y="583" class="cardTitle" >Pinia stores</text>
<text x="426" y="619" class="body" >Auth: login + avatar timestamp</text>
<text x="426" y="649" class="body" >Cart: cart ID + item quantities</text>
<text x="426" y="687" class="small" >In-memory reactive UI state</text>
<path d="M590 493 V540" class="link twoWay"/>
<text x="666" y="520" class="label" >reactive state</text>
<text x="404" y="764" class="small" >Router: createMemoryHistory</text>
<text x="404" y="788" class="small" >API calls include credentials</text>
</g>
<g id="express-api">
<rect x="940" y="210" width="440" height="600" rx="24" fill="#fff" stroke="#e5dfed" filter="url(#shadow)"/>
<text x="964" y="246" class="eyebrow" >03 API / SERVER</text>
<text x="964" y="286" class="heading" >Express API</text>
<text x="964" y="312" class="body" >Routes → Controllers → pg Pool</text>
<rect x="964" y="338" width="392" height="90" rx="16" fill="#f8f5ff" stroke="#e8def5"/>
<text x="984" y="366" class="cardTitle" >Members &amp; sign-in</text>
<text x="984" y="393" class="small" >POST /members · /members/login</text>
<text x="984" y="416" class="small" >GET /members/detail · /members/logout</text>
<rect x="964" y="446" width="392" height="78" rx="16" fill="#f8f5ff" stroke="#e8def5"/>
<text x="984" y="475" class="cardTitle" >Products</text>
<text x="984" y="503" class="body" >/products · search · detail · edit</text>
<rect x="964" y="542" width="392" height="78" rx="16" fill="#f8f5ff" stroke="#e8def5"/>
<text x="984" y="571" class="cardTitle" >Carts</text>
<text x="984" y="599" class="body" >/carts · items · quantity · confirm</text>
<rect x="964" y="638" width="392" height="112" rx="16" fill="#f8f5ff" stroke="#e8def5"/>
<text x="984" y="668" class="cardTitle" >Orders</text>
<text x="984" y="699" class="body" >/orders/:cusId · item details</text>
<text x="984" y="728" class="body" >/orders/admin · status · delete</text>
<text x="964" y="788" class="small" >Parameterized SQL queries</text>
</g>
<g id="postgresql">
<rect x="1470" y="210" width="390" height="390" rx="24" fill="#fff" stroke="#e5dfed" filter="url(#shadow)"/>
<text x="1494" y="246" class="eyebrow" >04 DATA</text>
<text x="1494" y="286" class="heading" >PostgreSQL</text>
<text x="1494" y="312" class="body" >Relational persistence</text>
<text x="1494" y="360" class="cardTitle" >Catalog</text>
<text x="1494" y="389" class="body" >products · brands</text>
<text x="1494" y="416" class="body" >series · producttype</text>
<text x="1494" y="457" class="cardTitle" >Members</text>
<text x="1494" y="486" class="body" >members</text>
<text x="1494" y="527" class="cardTitle" >Shopping state</text>
<text x="1494" y="555" class="body" >carts · cartDtl</text>
<text x="1494" y="581" class="body" >orders · orderDtl</text>
</g>
<g id="image-storage">
<rect x="1470" y="630" width="390" height="180" rx="24" fill="#fff" stroke="#e5dfed" filter="url(#shadow)"/>
<text x="1494" y="669" class="heading" style="font-size:26px">Backend filesystem</text>
<text x="1494" y="709" class="body" >/img_pd → product JPGs</text>
<text x="1494" y="741" class="body" >/img_mem → member avatars</text>
<text x="1494" y="783" class="small" >Multer: member image uploads</text>
</g>
<g id="connections">
<path d="M320 419 H372" class="link "/>
<text x="346" y="398" class="label" >UI</text>
<path d="M810 419 H930" class="link twoWay"/>
<text x="870" y="393" class="label" >HTTP / JSON</text>
<path d="M930 673 H810" class="link "/>
<text x="870" y="647" class="label" >cookie: token</text>
<path d="M1388 419 H1460" class="link twoWay"/>
<text x="1426" y="396" class="label" >SQL</text>
<path d="M1388 718 H1460" class="link twoWay"/>
<text x="1426" y="695" class="label" >files</text>
</g>
<g id="authentication">
<rect x="60" y="850" width="1800" height="224" rx="24" fill="#ede8f6" stroke="#ded5ec"/>
<text x="84" y="887" class="eyebrow" >05 AUTHENTICATION</text>
<text x="84" y="922" class="heading" style="font-size:26px">Passwords, sessions &amp; role checks</text>
<rect x="84" y="944" width="520" height="104" rx="14" fill="#fff" stroke="#e2daee"/>
<text x="104" y="976" class="cardTitle" >bcrypt password hashes</text>
<text x="104" y="1005" class="small" >Registration stores a hash in members.</text>
<text x="104" y="1031" class="small" >Login compares the submitted password.</text>
<rect x="628" y="944" width="600" height="104" rx="14" fill="#fff" stroke="#e2daee"/>
<text x="648" y="976" class="cardTitle" >JWT in HttpOnly cookie: token</text>
<text x="648" y="1005" class="small" >Signed session token · 1 hour expiry</text>
<text x="648" y="1031" class="small" >Member detail + product update + admin order checks</text>
<rect x="1252" y="944" width="584" height="104" rx="14" fill="#fff" stroke="#e2daee"/>
<text x="1272" y="976" class="cardTitle" >Environment-aware cookie flags</text>
<text x="1272" y="1005" class="small" >HTTP development: SameSite=Lax</text>
<text x="1272" y="1031" class="small" >HTTPS / production: Secure + SameSite=None</text>
</g>
<g id="source-notes">
<text x="60" y="1122" class="eyebrow" >SOURCE MAP</text>
<text x="60" y="1158" class="body" >Frontend: src/router · src/stores · src/components</text>
<text x="970" y="1158" class="body" >Backend: Routes · Controllers · service/database.js</text>
<path d="M60 1192 H1860" stroke="#ddd5e8"/>
<text x="60" y="1230" class="cardTitle" >Project: MonoShop · UI brand: MonoCraft</text>
<text x="1860" y="1230" class="body" text-anchor="end">Drawn from current source · 09 Nov 2026</text>
</g>
</svg>